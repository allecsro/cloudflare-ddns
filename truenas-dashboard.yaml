      # ═══════════════════════════════════════════════════════════════════
      # NETWORK - Inbound/Outbound Traffic
      # ═══════════════════════════════════════════════════════════════════
      - type: custom:stack-in-card
        mode: horizontal
        cards:
          # Inbound Traffic
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.truenas_interface_enp1s0_rx
                name: Inbound
                color: '#f44336'
            name: Inbound
            icon: mdi:download
            hours_to_show: 1
            points_per_hour: 60
            line_width: 2
            height: 60
            show:
              name: true
              icon: true
              state: true
              graph: true
              fill: true
              labels: false
              legend: false
            card_mod:
              style: |
                ha-card {
                  --ha-card-background: rgba(50, 50, 50, 0.5);
                  border-radius: 12px;
                }

          # Outbound Traffic
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.truenas_interface_enp1s0_tx
                name: Outbound
                color: '#4caf50'
            name: Outbound
            icon: mdi:upload
            hours_to_show: 1
            points_per_hour: 60
            line_width: 2
            height: 60
            show:
              name: true
              icon: true
              state: true
              graph: true
              fill: true
              labels: false
              legend: false
            card_mod:
              style: |
                ha-card {
                  --ha-card-background: rgba(50, 50, 50, 0.5);
                  border-radius: 12px;
                }

      # ═══════════════════════════════════════════════════════════════════
      # SYSTEM INFO - Uptime, Version, etc.
      # ═══════════════════════════════════════════════════════════════════
      - type: custom:stack-in-card
        mode: vertical
        cards:
          - type: markdown
            content: "### System Info"
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  box-shadow: none;
                  padding: 8px 16px 0 16px;
                }
          - type: entities
            entities:
              - entity: sensor.truenas_system_uptime
                name: Uptime
                icon: mdi:clock-outline
              - entity: sensor.truenas_system_version
                name: Version
                icon: mdi:information-outline
              - entity: sensor.truenas_system_load_1min
                name: Load (1 min)
                icon: mdi:gauge
              - entity: sensor.truenas_arc_size
                name: ARC Size
                icon: mdi:memory
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  box-shadow: none;
                }
