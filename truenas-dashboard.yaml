                      labels: false
                      legend: false
                    card_mod:
                      style: |
                        ha-card {
                          --ha-card-background: rgba(50, 50, 50, 0.5);
                          border-radius: 12px;
                        }
                  - type: glance
                    show_name: false
                    show_icon: true
                    show_state: true
                    columns: 2
                    entities:
                      - entity: sensor.truenas_disks_nvme2n1
                        name: Status
                        icon: mdi:power
                      - entity: binary_sensor.truenas_disks_nvme2n1_smart
                        name: S.M.A.R.T
                        icon: mdi:shield-check
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent;
                          box-shadow: none;
                          font-size: 0.8em;
                        }

          # Row 2: Drives 3-5
          - type: horizontal-stack
            cards:
              # Drive nvme3n1
              - type: custom:stack-in-card
                mode: vertical
                cards:
                  - type: custom:mini-graph-card
                    entities:
                      - entity: sensor.truenas_disks_nvme3n1_temperature
                        name: nvme3n1
                        color: '#ff9800'
                    name: Drive 3
                    icon: mdi:harddisk
