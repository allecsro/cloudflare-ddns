                        }
                  - type: glance
                    show_name: false
                    show_icon: true
                    show_state: true
                    columns: 2
                    entities:
                      - entity: sensor.truenas_disks_nvme3n1
                        name: Status
                        icon: mdi:power
                      - entity: binary_sensor.truenas_disks_nvme3n1_smart
                        name: S.M.A.R.T
                        icon: mdi:shield-check
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent;
                          box-shadow: none;
                          font-size: 0.8em;
                        }

              # Drive nvme4n1
              - type: custom:stack-in-card
                mode: vertical
                cards:
                  - type: custom:mini-graph-card
                    entities:
                      - entity: sensor.truenas_disks_nvme4n1_temperature
                        name: nvme4n1
                        color: '#ff9800'
                    name: Drive 4
                    icon: mdi:harddisk
                    hours_to_show: 24
                    points_per_hour: 2
                    line_width: 2
